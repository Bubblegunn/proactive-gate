version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7 # a version has to be a week old before it is proposed
    groups:
      dev-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /docs/site
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      docs-site:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python-dev:
        patterns: ["*"]
        update-types: [minor, patch]
