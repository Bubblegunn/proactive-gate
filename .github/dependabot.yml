version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7 # a version has to be a week old before it is proposed
    groups:
      # Split by dependency-type so the pull-request title cannot lie about what
      # is being changed. A single group named dev-dependencies with patterns ["*"]
      # also collects runtime dependencies, which is how a runtime bump arrived
      # titled as a dev-dependency one (workproof#23, surviving-lines 0.1.1 to 0.1.7).
      production-dependencies:
        dependency-type: production
        patterns: ["*"]
        update-types: [minor, patch]
      dev-dependencies:
        dependency-type: development
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /docs/site
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      docs-site:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python-dev:
        patterns: ["*"]
        update-types: [minor, patch]
