name: metrics
# Nightly: stars, unique visitors and clones (GitHub keeps traffic for 14 days only), npm downloads.
# Appended to metrics.csv on the `metrics` branch so main's history stays about the code.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions: {}
jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes metrics.csv to the metrics branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # the script pushes the metrics branch with the job token
      - run: sh scripts/record-metrics.sh
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }} # METRICS_TOKEN (optional) unlocks the traffic columns
          NPM_PACKAGE: ${{ github.event.repository.name }}
