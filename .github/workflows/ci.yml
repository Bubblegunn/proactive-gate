name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run examples
  package:
    # The tarball people install, checked before a tag exists: exports, types, bin, and a real install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npx publint --strict
      - run: npx attw --pack . --profile esm-only # ESM only, by design; node10 and CJS resolution are not a target
      - name: Install the packed tarball in an empty project and run it
        run: sh scripts/smoke-tarball.sh
  spec-lint:
    # The behaviour contract: every fixture and example policy has the shape spec/schema describes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: node test/spec-lint.mjs
  conformance:
    # Both implementations against the shared fixtures, and the README table regenerated from
    # that run. Its own job because it is the only one needing Node and Python together.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: npm install --ignore-scripts
      - run: node scripts/conformance-table.mjs --check
      - name: The same sentences in both languages, over every fixture
        run: node scripts/explain-parity.mjs
  python:
    # The Python sibling, held to the same fixtures: mypy strict, then every fixture through both gates.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]" build twine
      - run: python -m mypy --strict src/proactive_gate tests
      - run: python -m pytest -q
      - name: Build the wheel and sdist and check their metadata, the way the release does
        run: python -m build && python -m twine check dist/*
  release-gate:
    # The version the package states is the version every other file states, and npm pack ships only allowlisted paths.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run build --if-present
      - run: node scripts/release-gate.mjs
  postgres:
    # PostgresStore against a real PostgreSQL server. Its own job because service containers run
    # on Linux only, and because a store tested against a hand-written fake client cannot fail for
    # anything the fake gets wrong too. Tests that need this read PROACTIVE_GATE_POSTGRES_URL and
    # skip with a stated reason when it is unset, so `npm test` still passes with no database.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73 # postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PROACTIVE_GATE_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: node test/postgres.test.mjs
  ci-ok:
    # The one check the branch ruleset requires; it fails if any job above failed or was cancelled.
    if: always()
    needs: [test, package, spec-lint, conformance, python, release-gate, postgres]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "test: ${{ needs.test.result }}  package: ${{ needs.package.result }}  spec-lint: ${{ needs.spec-lint.result }}  conformance: ${{ needs.conformance.result }}  python: ${{ needs.python.result }}  release-gate: ${{ needs.release-gate.result }}  postgres: ${{ needs.postgres.result }}"
          test "${{ needs.test.result }}" = success && test "${{ needs.package.result }}" = success && test "${{ needs.spec-lint.result }}" = success && test "${{ needs.conformance.result }}" = success && test "${{ needs.python.result }}" = success && test "${{ needs.release-gate.result }}" = success && test "${{ needs.postgres.result }}" = success
