name: ci
on:
  push:
    branches: [main]
  pull_request:
  # A Dependabot auto-merge pushes with GITHUB_TOKEN, which starts no workflow, so main can sit
  # on commits CI never ran and the release script waits for a run that never comes. The nightly
  # run checks main within a day of any bot merge; workflow_dispatch lets a person start one now.
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run examples
  package:
    # The tarball people install, checked before a tag exists: exports, types, bin, and a real install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx publint --strict
      - run: npx attw --pack . --profile esm-only # ESM only, by design; node10 and CJS resolution are not a target
      - name: Install the packed tarball in an empty project and run it
        run: sh scripts/smoke-tarball.sh
  runtimes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.7"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Check the packed main import graph and run Bun and Deno decisions
        run: sh scripts/smoke-runtimes.sh
  coverage:
    # Line and branch coverage of dist/src over the same files npm test runs, with Node's own
    # runner and no dependency. scripts/coverage.mjs holds the floors and fails below them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run coverage
  spec-lint:
    # The behaviour contract: every fixture and example policy has the shape spec/schema describes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node test/spec-lint.mjs
  conformance:
    # All three implementations against the shared fixtures, and the README table regenerated
    # from that run. Its own job because it is the only one needing Node, Python and Go together.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
      - run: npm ci --ignore-scripts
      - name: Go builds clean before the table asks it to run the suite
        working-directory: go
        run: go vet ./... && go test ./conformance -run TestSpecVersion
      - run: node scripts/conformance-table.mjs --check
      - name: The same sentences in both languages, over every fixture
        run: node scripts/explain-parity.mjs
  python:
    # The Python sibling, held to the same fixtures: mypy strict, then every fixture through both gates.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # requirements-ci.txt is exported from uv.lock with hashes (see pyproject's ci group); the
      # package itself goes in without dependencies, so nothing reaches CI unpinned.
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m mypy --strict src/proactive_gate tests
      - run: python -m pytest -q
      - name: Build the wheel and sdist and check their metadata, the way the release does
        run: python -m build --no-isolation && python -m twine check dist/*
  release-gate:
    # The version the package states is the version every other file states, and npm pack ships only allowlisted paths.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build --if-present
      - run: node scripts/release-gate.mjs
  postgres:
    # PostgresStore against a real PostgreSQL server. Its own job because service containers run
    # on Linux only, and because a store tested against a hand-written fake client cannot fail for
    # anything the fake gets wrong too. Tests that need this read PROACTIVE_GATE_POSTGRES_URL and
    # skip with a stated reason when it is unset, so `npm test` still passes with no database.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73 # postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PROACTIVE_GATE_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
  redis:
    # RedisStore in both languages against a real Redis server, for the same reason the postgres
    # job exists: a fake client cannot fail for anything the fake gets wrong too. The tests read
    # PROACTIVE_GATE_REDIS_URL and skip with that reason when it is unset, so each run below
    # fails if that skip reason appears: a renamed variable would otherwise pass by skipping.
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499 # redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PROACTIVE_GATE_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: TypeScript RedisStore, contract suite and fault injection, against the server
        shell: bash
        run: |
          node --test --test-reporter=tap test/redis.test.mjs | tee redis-ts.tap
          ! grep -q "PROACTIVE_GATE_REDIS_URL is not set" redis-ts.tap
      - name: Python RedisStore against the server
        shell: bash
        working-directory: python
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pytest -rs tests/test_redis.py | tee redis-py.txt
          ! grep -q "PROACTIVE_GATE_REDIS_URL is not set" redis-py.txt
  docs-site:
    # The Starlight site pages.yml deploys, built from the pull request. docs/site has its own
    # lockfile and its own Dependabot group, and a bot merge pushes with GITHUB_TOKEN, which
    # starts no other workflow: without this job a docs dependency bump merges without the site
    # ever being built (#52 did).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci # esbuild and sharp need their install scripts for the platform binaries
        working-directory: docs/site
      - run: npm run build
        working-directory: docs/site
  ci-ok:
    # The one check the branch ruleset requires; it fails if any job above failed or was cancelled.
    if: always()
    needs: [test, coverage, package, spec-lint, conformance, python, release-gate, postgres, redis, docs-site]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "test: ${{ needs.test.result }}  coverage: ${{ needs.coverage.result }}  package: ${{ needs.package.result }}  spec-lint: ${{ needs.spec-lint.result }}  conformance: ${{ needs.conformance.result }}  python: ${{ needs.python.result }}  release-gate: ${{ needs.release-gate.result }}  postgres: ${{ needs.postgres.result }}  redis: ${{ needs.redis.result }}  docs-site: ${{ needs.docs-site.result }}"
          test "${{ needs.test.result }}" = success && test "${{ needs.coverage.result }}" = success && test "${{ needs.package.result }}" = success && test "${{ needs.spec-lint.result }}" = success && test "${{ needs.conformance.result }}" = success && test "${{ needs.python.result }}" = success && test "${{ needs.release-gate.result }}" = success && test "${{ needs.postgres.result }}" = success && test "${{ needs.redis.result }}" = success && test "${{ needs.docs-site.result }}" = success
